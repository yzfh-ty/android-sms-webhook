name: Build and release Android

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a signed GitHub Release (requires signing secrets)
        type: boolean
        default: true
      tag:
        description: Release tag, empty means v + versionName; must match the app version
        type: string
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish_release }}
      RELEASE_TAG: ${{ inputs.tag }}
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      publish: ${{ steps.metadata.outputs.publish }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release version and tag
        id: metadata
        run: python3 tools/prepare_release.py

      - name: Test release validation and packaging
        run: python3 -m unittest discover -s tools/tests -v

      - name: Prepare release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64$STORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]]; then
            if [[ "$PUBLISH_RELEASE" == "true" ]]; then
              echo "::error::Configure ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to publish signed APKs."
              exit 1
            fi
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            : "${KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}"
            : "${STORE_PASSWORD:?Missing ANDROID_STORE_PASSWORD}"
            : "${KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
            : "${KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
            echo "keystore=$RUNNER_TEMP/android-release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Test, lint and build APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon --no-configuration-cache testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Verify release APK signature
        if: steps.signing.outputs.signed == 'true'
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk'

      - name: Collect APKs and checksums
        env:
          SIGNED_BUILD: ${{ steps.signing.outputs.signed }}
        run: python3 tools/prepare_release.py --package

      - name: Upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove temporary keystore
        if: always()
        run: rm -f -- "$RUNNER_TEMP/android-release.jks"

  release:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apks
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS.txt)
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --target "$RELEASE_COMMIT" \
            --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
